[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RGTools"
version = "0.1.0a1"
description = "Regulatory Genome Tools — BED regions, motifs, BigWig tracks, and genomic element utilities"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "xp-genomic-tools contributors" },
]
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "biopython>=1.83",
    "pyBigWig>=0.3.22",
    "requests>=2.31",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
GenomicElementTools = "GenomicElementTools.__main__:main"
ExogeneousSequenceTools = "ExogeneousSequenceTools.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["RGTools*", "GenomicElementTools*", "ExogeneousSequenceTools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["*Test.py", "test_*.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*"]
addopts = "-q"
